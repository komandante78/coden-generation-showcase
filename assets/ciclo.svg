<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="t"><title id="t">Richiesta,piano,ricerca,creazione,verifica,memoria</title><rect width="1000" height="375" rx="18" fill="#0b1426"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf4ff"><text x="40" y="48" font-size="28" fill="#edf4ff" font-weight="bold">Il ciclo operativo di CodeN</text><text x="40" y="79" font-size="16" fill="#a9bdd9" font-weight="normal">Schema ad alto livello. L&#x27;autonomia generale resta un obiettivo di sviluppo.</text><rect x="40" y="115" width="285" height="90" rx="12" fill="#172842" stroke="#315475"/><text x="58" y="149" font-size="22" fill="#63d9f2" font-weight="bold">1. Richiesta</text><text x="58" y="177" font-size="16" fill="#c4d4e8" font-weight="normal">Obiettivo e contesto</text><text x="333" y="163" font-size="24" fill="#63d9f2" font-weight="normal">&gt;</text><rect x="365" y="115" width="285" height="90" rx="12" fill="#172842" stroke="#315475"/><text x="383" y="149" font-size="22" fill="#63d9f2" font-weight="bold">2. Piano</text><text x="383" y="177" font-size="16" fill="#c4d4e8" font-weight="normal">Passaggi e criteri</text><text x="658" y="163" font-size="24" fill="#63d9f2" font-weight="normal">&gt;</text><rect x="690" y="115" width="285" height="90" rx="12" fill="#172842" stroke="#315475"/><text x="708" y="149" font-size="22" fill="#63d9f2" font-weight="bold">3. Ricerca</text><text x="708" y="177" font-size="16" fill="#c4d4e8" font-weight="normal">Fonti e semantica</text><rect x="40" y="240" width="285" height="90" rx="12" fill="#172842" stroke="#315475"/><text x="58" y="274" font-size="22" fill="#63d9f2" font-weight="bold">4. Creazione</text><text x="58" y="302" font-size="16" fill="#c4d4e8" font-weight="normal">Nuovo lavoro o modifica</text><text x="333" y="288" font-size="24" fill="#63d9f2" font-weight="normal">&gt;</text><rect x="365" y="240" width="285" height="90" rx="12" fill="#172842" stroke="#315475"/><text x="383" y="274" font-size="22" fill="#63d9f2" font-weight="bold">5. Verifica</text><text x="383" y="302" font-size="16" fill="#c4d4e8" font-weight="normal">Test e correzioni</text><text x="658" y="288" font-size="24" fill="#63d9f2" font-weight="normal">&gt;</text><rect x="690" y="240" width="285" height="90" rx="12" fill="#172842" stroke="#315475"/><text x="708" y="274" font-size="22" fill="#63d9f2" font-weight="bold">6. Memoria</text><text x="708" y="302" font-size="16" fill="#c4d4e8" font-weight="normal">Esiti, prove e limiti</text></g></svg>
