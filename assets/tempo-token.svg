<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="745" viewBox="0 0 1000 745" role="img" aria-labelledby="t"><title id="t">Durate e token reali delle quattro missioni</title><rect width="1000" height="745" rx="18" fill="#0b1426"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf4ff"><text x="40" y="48" font-size="28" fill="#edf4ff" font-weight="bold">Tempo e token per missione</text><text x="40" y="80" font-size="16" fill="#a9bdd9" font-weight="normal">Misure reali; i token sono consumo locale, non un costo in euro.</text><text x="40" y="125" font-size="20" fill="#edf4ff" font-weight="bold">Token generativi (prompt + output)</text><text x="42" y="170" font-size="17" fill="#a9bdd9" font-weight="normal">N1</text><rect x="100" y="148" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="148" width="515.31" height="26" rx="5" fill="#20cce6"/><text x="775" y="169" font-size="17" fill="#edf4ff" font-weight="normal">39.639</text><text x="42" y="219" font-size="17" fill="#a9bdd9" font-weight="normal">N2</text><rect x="100" y="197" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="197" width="611.16" height="26" rx="5" fill="#20cce6"/><text x="775" y="218" font-size="17" fill="#edf4ff" font-weight="normal">47.012</text><text x="42" y="268" font-size="17" fill="#a9bdd9" font-weight="normal">N3</text><rect x="100" y="246" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="246" width="374.74" height="26" rx="5" fill="#20cce6"/><text x="775" y="267" font-size="17" fill="#edf4ff" font-weight="normal">28.826</text><text x="42" y="317" font-size="17" fill="#a9bdd9" font-weight="normal">N4</text><rect x="100" y="295" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="295" width="507.42" height="26" rx="5" fill="#20cce6"/><text x="775" y="316" font-size="17" fill="#edf4ff" font-weight="normal">39.032</text><text x="40" y="405" font-size="20" fill="#edf4ff" font-weight="bold">Durata della missione</text><text x="42" y="450" font-size="17" fill="#a9bdd9" font-weight="normal">N1</text><rect x="100" y="428" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="428" width="466.34" height="26" rx="5" fill="#9274ff"/><text x="775" y="449" font-size="17" fill="#edf4ff" font-weight="normal">430.5 s</text><text x="42" y="499" font-size="17" fill="#a9bdd9" font-weight="normal">N2</text><rect x="100" y="477" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="477" width="526.48" height="26" rx="5" fill="#9274ff"/><text x="775" y="498" font-size="17" fill="#edf4ff" font-weight="normal">486.0 s</text><text x="42" y="548" font-size="17" fill="#a9bdd9" font-weight="normal">N3</text><rect x="100" y="526" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="526" width="208.77" height="26" rx="5" fill="#9274ff"/><text x="775" y="547" font-size="17" fill="#edf4ff" font-weight="normal">192.7 s</text><text x="42" y="597" font-size="17" fill="#a9bdd9" font-weight="normal">N4</text><rect x="100" y="575" width="650" height="26" rx="5" fill="#172842"/><rect x="100" y="575" width="548.35" height="26" rx="5" fill="#9274ff"/><text x="775" y="596" font-size="17" fill="#edf4ff" font-weight="normal">506.2 s</text><text x="40" y="687" font-size="17" fill="#edf4ff" font-weight="normal">Totale: 154.509 token | 21 chiamate | 26 min 55 s di missione.</text><text x="40" y="714" font-size="14" fill="#a9bdd9" font-weight="normal">Durate comprensive di ricerca, verifica e ripresa; avvio e valutazione finale esclusi.</text></g></svg>
