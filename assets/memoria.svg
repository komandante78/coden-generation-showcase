<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="t"><title id="t">Quattro osservazioni,una ipotesi non verificata,zero nuovi metodi qualificati</title><rect width="1000" height="390" rx="18" fill="#0b1426"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf4ff"><text x="40" y="48" font-size="28" fill="#edf4ff" font-weight="bold">Memoria: cosa e stato conservato</text><text x="40" y="80" font-size="16" fill="#a9bdd9" font-weight="normal">Persistenza, ipotesi e apprendimento sono risultati diversi.</text><text x="40" y="135" font-size="19" fill="#edf4ff" font-weight="normal">Osservazioni di esito verificato</text><rect x="475" y="112" width="360" height="32" rx="5" fill="#20cce6"/><text x="875" y="135" font-size="22" fill="#20cce6" font-weight="bold">4</text><text x="40" y="199" font-size="19" fill="#edf4ff" font-weight="normal">Ipotesi ancora non verificata</text><rect x="475" y="176" width="90" height="32" rx="5" fill="#ffc56d"/><text x="875" y="199" font-size="22" fill="#ffc56d" font-weight="bold">1</text><text x="40" y="263" font-size="19" fill="#edf4ff" font-weight="normal">Nuovi metodi qualificati</text><rect x="475" y="240" width="0" height="32" rx="5" fill="#9274ff"/><text x="875" y="263" font-size="22" fill="#9274ff" font-weight="bold">0</text><text x="40" y="355" font-size="15" fill="#a9bdd9" font-weight="normal">Il riuso di metodi su nuove famiglie e il beneficio causale restano NON MISURATI.</text></g></svg>
