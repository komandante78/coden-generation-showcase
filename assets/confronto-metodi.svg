<text x="35" y="463" font-size="17">Due coppie, un tentativo per caso. Piu basso indica minor costo osservato.</text>
<text x="35" y="495" font-size="15" fill="#b1c4df">Acquisizione e warmup fuori dai grafici; tutti i costi sono riportati nei dati.</text>
<text x="35" y="527" font-size="15" fill="#b1c4df">Patch corretta e riuso qualificato sono esiti distinti. Nessun vantaggio generale dichiarato.</text>
