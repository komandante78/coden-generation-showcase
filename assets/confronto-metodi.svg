<rect x="555" y="201" width="230.06" height="26" rx="4" fill="#71869e"/>
<text x="793.06" y="220" font-size="15">349.6 s</text>
<rect x="555" y="238" width="244.39" height="26" rx="4" fill="#39b8e8"/>
<text x="807.39" y="257" font-size="15">371.4 s</text>
<text x="35" y="332" font-size="16" fill="#c5d7ef">Esportazione XML</text>
<rect x="35" y="345" width="218.89" height="26" rx="4" fill="#71869e"/>
